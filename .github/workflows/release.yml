name: Release

on:
  push:
    branches: [main]
  # Retry a released version by selecting its v<version> tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT or GitHub App token allows the release PR to trigger CI.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

  publish:
    needs: release-please
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Verify the release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Run Release from a stable v<version> release tag"
              exit 1
            fi
          elif [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release SHA differs from GITHUB_SHA; retry from the release tag"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify workspace release versions
        run: node scripts/release.mjs verify

      # The job has publication permissions; dependency lifecycle scripts do not run here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npm run build

      - name: Verify package exports are committed
        run: git diff --exit-code package.json 'packages/*/package.json'

      - name: Publish through npm Trusted Publisher
        run: node scripts/release.mjs publish

      - name: Move the major release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          MAJOR="v${VERSION%%.*}"
          LATEST=$(git tag --list "$MAJOR.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$LATEST" != "v$VERSION" ]; then
            echo "Leaving $MAJOR unchanged: v$VERSION is older than $LATEST"
            exit 0
          fi
          git tag -f "$MAJOR" HEAD
          git push -f origin "refs/tags/$MAJOR"
